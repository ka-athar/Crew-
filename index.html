<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew Ledger</title>
<meta name="description" content="Assign tasks, track deadlines and read weekly and monthly team reports.">
<meta name="theme-color" content="#14211D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crew Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="shell"></div>
<div id="overlay"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="cover" class="cover" hidden>
  <h2>Screen covered</h2>
  <p>Covered after a period of inactivity to keep your team's work private.</p>
  <div><button class="primary" id="uncover" type="button">Continue</button></div>
</div>
<noscript><p style="padding:24px">Crew Ledger needs JavaScript to run.</p></noscript>
<script src="/app.js"></script>
</body>
</html>
